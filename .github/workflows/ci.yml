name: ERP Carton CI

on:
  push:
  pull_request:

env:
  SECRET_KEY: ci-secret-key
  DEBUG: "False"
  APP_ENV: ci
  DB_NAME: erp_carton_ci
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: 127.0.0.1
  DB_PORT: "5432"
  ALLOWED_HOSTS: 127.0.0.1,localhost
  CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
  CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
  VITE_API_BASE_URL: http://127.0.0.1:8000/api

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_carton_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d erp_carton_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-production.txt
      - name: Run backend migrations and tests
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py test core.tests_auth_smoke core.tests_module_permissions core.tests_operations_log

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: erp_carton_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d erp_carton_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-production.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Prepare database and demo users
        working-directory: backend
        run: |
          python manage.py migrate
          python manage.py bootstrap_uat_demo --reset-passwords --password Demo123!
      - name: Start backend
        working-directory: backend
        run: nohup python manage.py runserver 127.0.0.1:8000 > ../backend.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: nohup npm run dev -- --host 127.0.0.1 --port 5173 > ../frontend.log 2>&1 &
      - name: Wait for services
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health/ >/dev/null && curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Services did not start in time"
          exit 1
      - name: Run HTTP smoke check
        working-directory: backend
        run: python manage.py smoke_http --backend-base http://127.0.0.1:8000 --frontend-base http://127.0.0.1:5173 --username uat_admin --password Demo123!
      - name: Run Playwright smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          E2E_ADMIN_USERNAME: uat_admin
          E2E_ADMIN_PASSWORD: Demo123!
          E2E_SALES_USERNAME: uat_sales
          E2E_SALES_PASSWORD: Demo123!
        run: npm run e2e:smoke
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backend.log
            frontend.log
